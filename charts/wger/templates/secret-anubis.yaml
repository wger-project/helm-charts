{{- if .Values.anubis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wger.secretName.anubis" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-5"
stringData:
  # ed25519 key signing the challenge pass cookies; a new key invalidates
  # all passes, so every visitor gets challenged again
  private-key-hex: {{ include "wger.secretValue" (dict "ctx" $ "name" (include "wger.secretName.anubis" .) "key" "private-key-hex" "value" .Values.anubis.secret.privateKeyHex "hex" true) | quote }}
{{- end }}
