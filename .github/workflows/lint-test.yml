---
name: Lint and Test Charts

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add dependent chart repositories
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}
      
      # https://github.com/marketplace/actions/kind-cluster
      #
      # kind can't provide ReadWriteMany storage (kubernetes-sigs/kind#1487),
      # so the install uses ci/kind-values.yaml with ReadWriteOnce claims:
      # on the single kind node all pods can still share them.
      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.15.1

      # the first start of wger runs the database migrations and the powersync
      # hook waits for them, which takes longer than helm's default of 5m
      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }} --helm-extra-args "--timeout 15m"
